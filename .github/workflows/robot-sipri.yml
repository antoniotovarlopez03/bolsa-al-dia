# Robot de Bolsa Sur: lee los listados públicos de SIPRI y guarda solo cifras.
# Coste: 0 € (GitHub Actions es gratuito en repositorios públicos).
# Límite de seguridad: máximo 10 minutos por ejecución y 40 peticiones (ver robot/sipri.mjs).
# Si falla, GitHub envía un correo al dueño del repositorio (aviso gratuito).
name: Robot SIPRI

on:
  schedule:
    # Lectura completa: de lunes a viernes, 4 veces al día (hora UTC; en España +1 en invierno, +2 en verano).
    - cron: '30 7,11,15,19 * * 1-5'
    # Modo rápido (para avisar enseguida): cada 10 min en las franjas en que SIPRI publica.
    # Martes y jueves 9:00–14:59 (convocatorias y adjudicación del jueves); lunes 9:00–11:59 (adjudicación).
    # En modo rápido solo se leen los títulos (5 lecturas); los datos, únicamente si hay algo nuevo.
    - cron: '*/10 8-13 * * 2,4'
    - cron: '*/10 8-10 * * 1'
  workflow_dispatch: # botón para lanzarlo a mano
    inputs:
      aviso_prueba:
        description: 'Enviar un aviso de prueba a todos los suscritos'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: robot-sipri
  cancel-in-progress: false

jobs:
  leer:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: Pruebas del robot
        run: node --test robot/procesar.test.mjs
      - name: Leer SIPRI y avisar
        run: node robot/sipri.mjs
        env:
          RAPIDO: ${{ github.event_name == 'schedule' && github.event.schedule != '30 7,11,15,19 * * 1-5' }}
          AVISOS_URL: https://bolsa-al-dia.vercel.app/api/avisar
          AVISOS_SECRET: ${{ secrets.AVISOS_SECRET }} # lo pone Antonio en GitHub → Settings → Secrets
          AVISO_PRUEBA: ${{ github.event.inputs.aviso_prueba == 'true' }}
      - name: Guardar datos si han cambiado
        run: |
          if [ -n "$(git status --porcelain public/datos)" ]; then
            git config user.name "bolsa-sur-robot"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add public/datos
            git commit -m "Datos SIPRI $(date -u +%Y-%m-%dT%H:%MZ)"
            git pull --rebase -q || true
            git push
          else
            echo "Sin cambios."
          fi
